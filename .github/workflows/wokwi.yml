name: Wokwi Simulation CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/wokwi.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/wokwi.yml'

jobs:
  wokwi-simulation:
    name: Headless ESP32 Wokwi Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Set up ESP32 Board Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14
          arduino-cli lib install "DHT sensor library"@1.4.6 "Adafruit Unified Sensor"@1.1.14

      - name: Compile Irrigation Node Firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir firmware/build firmware/irrigation_node

      - name: Run Wokwi Headless Simulation
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: firmware
          timeout: 20000
          expect_text: '[AGRISENSE] Irrigation Node Ready'
        continue-on-error: true
