name: Firmware CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  native-tests:
    name: Native C++ Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Run Irrigation Logic Tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I firmware/irrigation_node firmware/test/test_irrigation_logic.cpp -o test_irrigation
          ./test_irrigation

      - name: Compile and Run Vision Logic Tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I firmware/vision_node firmware/test/test_vision_logic.cpp -o test_vision
          ./test_vision

  arduino-lint-and-build:
    name: Arduino CLI Lint & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Initialize Arduino Core for ESP32
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14
          arduino-cli lib install "DHT sensor library"@1.4.6 "Adafruit Unified Sensor"@1.1.14

      - name: Compile Irrigation Node Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/irrigation_node

